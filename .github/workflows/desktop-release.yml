# Desktop release: builds the Tauri 2 app for Linux (AppImage + .deb) and macOS
# (one universal .dmg + updater bundle), plus the web app as web.tar.gz, and
# publishes them as one GitHub Release. How it flows, where artifacts land,
# install notes: docs/desktop-builds.md.
#
# Four channels:
# - push to the `release` branch (or Run workflow on it): the CONTINUOUS
#   channel. Pushing to main builds nothing here (CI still runs), so Actions
#   minutes are spent only when someone ships: `git push origin main:release`.
#   Version <major>.<minor>.<run number> from tauri.conf.json, a PUBLISHED
#   prerelease (tag public-v<version>, or v<version> for team); a public one (the default, below) is then uploaded
#   to dist.ohhi.md by the `dist` job and installed desktop apps update from
#   it. Bursts collapse: cancel-in-progress keeps only the newest release
#   build running.
# - tag v*: the version in tauri.conf.json (must match the tag), a DRAFT
#   release to check and publish by hand. Never cancelled.
# - Run workflow on any other branch: a DRAFT prerelease, uploaded nowhere.
# - the NIGHTLY channel: a daily schedule builds `main` (and builds nothing
#   when `main` has not moved since the last nightly); Run workflow › channel
#   `nightly` builds any branch the same way. A public-flavour Linux AppImage
#   under its own app identifier (`md.ohhi.nightly`, product `ohhi-nightly`),
#   so it installs beside the stable app with its own data folder, tagged
#   `nightly-v<version>`, PUBLISHED as a prerelease and uploaded to
#   dist.ohhi.md under `nightly/`, where installed nightlies update from. The
#   newest seven nightly releases are kept on GitHub (the `prune` job). No
#   macOS build, no .deb.
#
# Two flavours (the `channel` input of Run workflow). A push to `release`, and
# Run workflow with no channel chosen, build `public`; `nightly` is the public
# flavour on its own feed; a tag push is always `team`.
# apps/web/scripts/flavour.mjs and docs/public-deploy.md:
# - public (default): no pin, no relay, the updater feed at
#   https://dist.ohhi.md/stable/latest.json. Tagged `public-v<version>`, so
#   a team host's pull (which takes only `v<semver>` tags) never deploys it.
#   On `release` it is published and the `dist` job uploads it to the R2
#   bucket behind dist.ohhi.md; on any other branch it stays a draft and
#   uploads nothing. So a release is one push: `git push origin main:release`.
# - team (Run workflow › channel `team`, or a tag push): the CSP pinned to
#   TEAM_HOST, its relay baked in, the feed on the team host, tagged
#   v<version>. The company's team host was retired on 2026-10-16; the
#   flavour stays in the code until a later cleanup removes it.
#
# Security shape:
# - Build jobs run third-party code (npm deps, cargo build scripts, the Tauri
#   bundler) with a READ-ONLY token and no persisted git credentials. Only the
#   small `release` job, which checks nothing out and builds nothing, can write;
#   it runs one script of ours (updater-manifest.mjs, handed over as an
#   artifact by `meta`) with the runner's preinstalled node.
# - The updater signing key (secret TAURI_SIGNING_PRIVATE_KEY) has to be in the
#   build jobs, because the bundler signs as it bundles. Without the secret the
#   build still succeeds, just without updater bundles or latest.json.
# - Every third-party action is pinned to a full commit SHA (tag in the comment).
name: Desktop release

on:
  push:
    branches: [release]
    tags: ['v*']
    # Path filters apply to the branch push only; tag pushes always build.
    # Everything builds except the docs, root *.md and .claude/ — but
    # docs/guide/** is re-included: the web app embeds the guide pages, so a
    # guide-only push must rebuild it. Order matters: a later pattern overrides
    # an earlier one. Not '!**/*.md': apps/web bundles templates/*.md.
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!.claude/**'
      - 'docs/guide/**'
  schedule:
    # The nightly channel. GitHub runs a schedule from the default branch only,
    # so this builds `main`; `meta` skips the run when it has not moved.
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which build: public (dist.ohhi.md), nightly (dist.ohhi.md/nightly, a second app beside the stable one) or team (pinned to TEAM_HOST)'
        type: choice
        options: [public, nightly, team]
        default: public

permissions:
  contents: read

concurrency:
  # Per channel: a public build must never cancel the team's or a nightly (or
  # the reverse). The same expression as CHANNEL_INPUT below, so the group
  # names the channel actually built: a branch push is public, the schedule
  # nightly, a tag push team.
  group: desktop-release-${{ github.ref }}-${{ inputs.channel || (github.event_name == 'schedule' && 'nightly') || (github.ref_type == 'tag' && 'team' || 'public') }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/release' }}

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: version + release config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      team_host: ${{ steps.meta.outputs.team_host }}
      relay: ${{ steps.meta.outputs.relay }}
      secret_hint: ${{ steps.meta.outputs.secret_hint }}
      network_note: ${{ steps.meta.outputs.network_note }}
      flavour: ${{ steps.meta.outputs.flavour }}
      updater_endpoint: ${{ steps.meta.outputs.updater_endpoint }}
      manifest_base: ${{ steps.meta.outputs.manifest_base }}
      # Nightly: `skip` when main has not moved (nothing else runs), `matrix`
      # the platforms to build (Linux only), `platforms` for latest.json, and
      # where the dist job puts the files: `dist_dir` (stable | nightly) holds
      # the feed, `key_prefix` ('' | nightly/) goes before <version>/.
      skip: ${{ steps.meta.outputs.skip }}
      matrix: ${{ steps.meta.outputs.matrix }}
      platforms: ${{ steps.meta.outputs.platforms }}
      dist_dir: ${{ steps.meta.outputs.dist_dir }}
      key_prefix: ${{ steps.meta.outputs.key_prefix }}
      downloads_url: ${{ steps.meta.outputs.downloads_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out version, channel and team host
        id: meta
        env:
          TEAM_HOST: ${{ vars.TEAM_HOST }}
          DEFAULT_RELAY: ${{ vars.DEFAULT_RELAY }}
          TEAM_SECRET_HINT: ${{ vars.TEAM_SECRET_HINT }}
          TEAM_NETWORK_NOTE: ${{ vars.TEAM_NETWORK_NOTE }}
          # Run workflow's choice; a push has none: a tag push builds team,
          # a branch push (`release`) public, the schedule nightly.
          CHANNEL_INPUT: ${{ inputs.channel || (github.event_name == 'schedule' && 'nightly') || (github.ref_type == 'tag' && 'team' || 'public') }}
          PUBLIC_WEB_HOST: ${{ vars.PUBLIC_WEB_HOST }}
          PUBLIC_DIST_HOST: ${{ vars.PUBLIC_DIST_HOST }}
          # Only to read the releases list (the last nightly's commit).
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          skip=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$base"; channel=tagged
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/src-tauri/tauri.conf.json version $version"
              exit 1
            fi
          else
            # The updater compares semver, so every build must count up: the run
            # number does, for this workflow's whole life (every channel shares
            # it, so a nightly and a release never carry the same version).
            version="$(echo "$base" | cut -d. -f1,2).${GITHUB_RUN_NUMBER}"
            if [ "$CHANNEL_INPUT" = nightly ]; then channel=nightly
            elif [ "$GITHUB_REF" = refs/heads/release ]; then channel=continuous
            else channel=draft; fi
          fi
          if [ "$channel" = nightly ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # The schedule builds only what the feed does not have: the
            # version nightly/latest.json names was published with
            # --target <sha>, so that release's target is its commit. No feed
            # yet, a nightly that never reached it (its upload failed) or an
            # API hiccup all build (a spare nightly at worst) rather than skip.
            dist_base=$(node apps/web/scripts/flavour.mjs public | sed -n 's/^dist_base=//p')
            fed=$(curl -fsS --max-time 20 "$dist_base/nightly/latest.json" 2>/dev/null \
              | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null || true)
            [[ "$fed" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fed=
            last=
            if [ -n "$fed" ]; then
              last=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly-v$fed" --jq .target_commitish 2>/dev/null || true)
            fi
            if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
              echo "::notice::$GITHUB_REF_NAME is still at ${GITHUB_SHA::12}, the commit nightly-v$fed on the feed was built from: nothing to build"
              skip=true
            fi
          fi
          if [ -n "$TEAM_HOST" ] && ! [[ "$TEAM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Repository variable TEAM_HOST must be a bare hostname, got '$TEAM_HOST'"
            exit 1
          fi
          relay="${TEAM_HOST:+wss://$TEAM_HOST/relay}"
          relay="${relay:-$DEFAULT_RELAY}"
          # One sentence each (docs/desktop-builds.md, "Build settings"); a
          # newline would end the output line, so they are flattened.
          secret_hint=$(printf '%s' "$TEAM_SECRET_HINT" | tr '\r\n' '  ')
          network_note=$(printf '%s' "$TEAM_NETWORK_NOTE" | tr '\r\n' '  ')
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          tag="v$version"
          dist_dir=; key_prefix=; platforms=linux,darwin; downloads_url=
          if [ "$CHANNEL_INPUT" = public ] || [ "$CHANNEL_INPUT" = nightly ]; then
            # The public flavour (apps/web/scripts/flavour.mjs): none of the
            # team's settings, and its own tag so the team host never takes it.
            [ "$channel" = tagged ] && { echo "::error::a tag push is always a team build"; exit 1; }
            TEAM_HOST=; relay=; secret_hint=; network_note=
            # The hosts' one default lives in flavour.mjs (PUBLIC_*_HOST override).
            pub=$(node apps/web/scripts/flavour.mjs public)
            pub_get() { printf '%s\n' "$pub" | sed -n "s/^$1=//p"; }
            flavour=public
            if [ "$channel" = nightly ]; then
              # Beside stable in the same bucket: nightly/<version>/<file> and
              # the feed at nightly/latest.json. Linux only, so no macOS
              # minutes go to a build nobody downloads by hand.
              tag="nightly-v$version"
              dist_dir=nightly; key_prefix=nightly/; platforms=linux
              updater_endpoint="$(pub_get dist_base)/nightly/latest.json"
              manifest_base="$(pub_get dist_base)/nightly/$version"
              # The web build's downloads list (flavour.mjs defaults it to
              # stable/); a nightly reads its own.
              downloads_url="$(pub_get dist_base)/nightly/downloads.json"
            else
              tag="public-v$version"
              dist_dir=stable
              updater_endpoint=$(pub_get updater_endpoint)
              manifest_base="$(pub_get dist_base)/$version"
            fi
          elif [ -n "$TEAM_HOST" ]; then
            flavour=team
            updater_endpoint="https://$TEAM_HOST/updates/latest.json"
            manifest_base="https://$TEAM_HOST/updates/$tag"
          else
            flavour=; updater_endpoint=; manifest_base=
          fi
          {
            echo "tag=$tag"
            echo "team_host=$TEAM_HOST"
            echo "relay=$relay"
            echo "secret_hint=$secret_hint"
            echo "network_note=$network_note"
            echo "flavour=$flavour"
            echo "updater_endpoint=$updater_endpoint"
            echo "manifest_base=$manifest_base"
            echo "platforms=$platforms"
            echo "dist_dir=$dist_dir"
            echo "key_prefix=$key_prefix"
            echo "downloads_url=$downloads_url"
          } >> "$GITHUB_OUTPUT"
          # The build matrix, one entry per platform in $platforms:
          # - linux-x86_64 on 22.04 = glibc 2.35 baseline: the AppImage/.deb run
          #   on 22.04 and newer. This job also packs the web app (web.tar.gz)
          #   the team host serves. A nightly bundles the AppImage only: the
          #   .deb cannot update itself and nothing links it.
          # - macos-universal: one universal build (arm64 + x86_64 lipo'd)
          #   instead of two per-arch jobs: teammates cannot download the wrong
          #   one, and total macOS minutes are about the same (each arch
          #   compiles once either way). `app` makes the updater bundle
          #   (.app.tar.gz), `dmg` the installer.
          matrix=$(PLATFORMS="$platforms" CHANNEL="$channel" node -e '
            const linuxBundles = process.env.CHANNEL === "nightly" ? "appimage" : "appimage,deb"
            const all = [
              { os: "linux", name: "linux-x86_64", runner: "ubuntu-22.04", "rust-targets": "",
                args: `--bundles ${linuxBundles}`, "bundle-dir": "apps/desktop/src-tauri/target/release/bundle" },
              { os: "darwin", name: "macos-universal", runner: "macos-15", "rust-targets": "aarch64-apple-darwin,x86_64-apple-darwin",
                args: "--target universal-apple-darwin --bundles app,dmg", "bundle-dir": "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle" },
            ]
            const want = process.env.PLATFORMS.split(",")
            const include = all.filter((m) => want.includes(m.os))
            if (!include.length) throw new Error(`no platform to build for "${process.env.PLATFORMS}"`)
            console.log(JSON.stringify({ include }))
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "::notice::$channel ${flavour:-generic} build $tag (team host: ${TEAM_HOST:-none}, relay: ${relay:-none}, update feed: ${updater_endpoint:-none}, platforms: $platforms)"

      # Flat, so the release job runs tools/<script>.mjs. Node builtins only.
      - name: Gather release tools
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp apps/desktop/scripts/updater-manifest.mjs apps/web/scripts/downloads-manifest.mjs "$RUNNER_TEMP/release-tools/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools/
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.name }})
    needs: meta
    # A scheduled nightly of a `main` that has not moved builds nothing; the
    # release and dist jobs need this one, so they are skipped with it.
    if: needs.meta.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The platforms `meta` chose (its comment describes each entry).
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      TEAM_HOST: ${{ needs.meta.outputs.team_host }}
      UPDATER_ENDPOINT: ${{ needs.meta.outputs.updater_endpoint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            libdbus-1-dev patchelf file xdg-utils

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      # Team builds talk to one host, so both policies name only it
      # (docs/desktop-builds.md, "The connect-src trade-off", option 1). Edits
      # the working tree before anything reads the policies.
      - name: Pin the CSP to the team host
        if: env.TEAM_HOST != ''
        run: node apps/desktop/scripts/pin-csp.mjs "$TEAM_HOST"

      # tauri.conf.json's beforeBuildCommand is intentionally empty (Rush drives
      # the web app; see apps/desktop/README.md), so the frontend is built here,
      # where the release-time env is visible in the workflow, before Tauri
      # embeds apps/web/dist. Every job builds it with the same env.
      - name: Build web app
        working-directory: apps/web
        env:
          VITE_DEFAULT_RELAY: ${{ needs.meta.outputs.relay }}
          VITE_TEAM_SECRET_HINT: ${{ needs.meta.outputs.secret_hint }}
          VITE_TEAM_NETWORK_NOTE: ${{ needs.meta.outputs.network_note }}
          # The pinned host (the CSP above allows no other relay): the app
          # hides "Use another…" and says it syncs through this host only.
          VITE_TEAM_HOST: ${{ needs.meta.outputs.team_host }}
          # team | public | '' (apps/web/scripts/flavour.mjs): derives the
          # downloads list (and, public, the web origin share links use) and
          # checks dist/_headers is pinned (team) or not (public).
          VITE_FLAVOUR: ${{ needs.meta.outputs.flavour }}
          PUBLIC_WEB_HOST: ${{ vars.PUBLIC_WEB_HOST }}
          PUBLIC_DIST_HOST: ${{ vars.PUBLIC_DIST_HOST }}
          # Set for a nightly only (its own downloads.json); empty, the
          # flavour's default applies.
          VITE_DOWNLOADS_URL: ${{ needs.meta.outputs.downloads_url }}
        run: node ../../common/scripts/install-run-rushx.js build

      - name: CSP guard
        run: node apps/desktop/scripts/check-csp.mjs

      # Archive root = dist/, so index.html and _headers are top-level.
      - name: Pack the web app
        if: runner.os == 'Linux'
        run: tar -czf "$RUNNER_TEMP/web.tar.gz" -C apps/web/dist .

      # Merged over tauri.conf.json by `tauri build --config`: the build's
      # version, updater bundles (only when the signing key is present, so the
      # base config and local builds never need it), the update feed and, for
      # a nightly, its own identity.
      - name: Release config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          signed=false
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && signed=true
          [ "$signed" = true ] || echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no updater bundles in this build"
          SIGNED="$signed" node -e '
            const c = { version: process.env.VERSION }
            if (process.env.CHANNEL === "nightly") {
              // A second app: its own identifier gives it its own data folder
              // (vault list, relay tokens, folder grants), so it installs
              // beside the stable app; its own product name names the
              // AppImage and the window, so the two are told apart. The
              // app-id migration (apps/desktop/src-tauri/src/app_id_migration.rs)
              // leaves any identifier but the stable one alone.
              // `--config` replaces an array whole, so the windows come
              // from the base config with only the title changed.
              const base = require("./apps/desktop/src-tauri/tauri.conf.json")
              c.identifier = "md.ohhi.nightly"
              c.productName = "ohhi-nightly"
              c.app = { windows: base.app.windows.map((w) => ({ ...w, title: `${w.title} (nightly)` })) }
            }
            if (process.env.SIGNED === "true") c.bundle = { createUpdaterArtifacts: true }
            if (process.env.UPDATER_ENDPOINT)
              c.plugins = { updater: { endpoints: [process.env.UPDATER_ENDPOINT] } }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(c, null, 2))
            console.log(JSON.stringify(c, null, 2))
          ' "$RUNNER_TEMP/tauri.release.json"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}

      # Build only: no tagName/releaseId, so tauri-action creates no release and
      # needs no token. tauriScript is the repo's pinned @tauri-apps/cli; without
      # it the action cannot see Rush's lockfile and installs an unpinned CLI.
      #
      # macOS is ad-hoc signed (bundle.macOS.signingIdentity "-"). To sign and
      # notarize, add these secrets (APPLE_CERTIFICATE = base64 Developer ID
      # Application .p12; APPLE_PASSWORD = app-specific password), uncomment,
      # and drop signingIdentity "-" from tauri.conf.json.
      - name: Build desktop app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password; set explicitly so the CLI never prompts.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: ${{ github.workspace }}/apps/desktop/node_modules/.bin/tauri
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri.release.json
          uploadUpdaterJson: false

      # One flat folder per platform with release-ready names: the bundler calls
      # the macOS updater bundle plain `ohhi.app.tar.gz`, so it gains the
      # version and arch like every other asset; whitespace never reaches a URL.
      - name: Collect assets
        env:
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
        run: |
          out="$RUNNER_TEMP/assets"; mkdir -p "$out"
          shopt -s nullglob
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$BUNDLE_DIR"/appimage/*.AppImage "$BUNDLE_DIR"/appimage/*.AppImage.sig "$BUNDLE_DIR"/deb/*.deb "$BUNDLE_DIR"/deb/*.deb.sig "$out"/
            cp "$RUNNER_TEMP/web.tar.gz" "$out"/
          else
            cp "$BUNDLE_DIR"/dmg/*.dmg "$out"/
            for f in "$BUNDLE_DIR"/macos/*.app.tar.gz "$BUNDLE_DIR"/macos/*.app.tar.gz.sig; do
              name=$(basename "$f")              # ohhi.app.tar.gz[.sig]
              cp "$f" "$out/${name%%.app.tar.gz*}_${VERSION}_universal.app.tar.gz${name#*.app.tar.gz}"
            done
          fi
          for f in "$out"/*; do
            name=$(basename "$f"); clean="${name//[[:space:]]/_}"
            [ "$clean" = "$name" ] || mv "$f" "$out/$clean"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ohhi-${{ matrix.name }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      TEAM_HOST: ${{ needs.meta.outputs.team_host }}
      RELAY: ${{ needs.meta.outputs.relay }}
      FLAVOUR: ${{ needs.meta.outputs.flavour }}
      UPDATER_ENDPOINT: ${{ needs.meta.outputs.updater_endpoint }}
      MANIFEST_BASE: ${{ needs.meta.outputs.manifest_base }}
      PLATFORMS: ${{ needs.meta.outputs.platforms }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ohhi-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tools
          path: tools

      # The team host fetches every asset from https://<team host>/updates/<tag>/, so
      # a team latest.json's URLs point there, not at GitHub (a private repo's
      # assets need credentials the updater doesn't have); a public one's
      # point at https://dist.ohhi.md/<version>/, where the dist job puts them.
      - name: Updater manifest
        if: env.MANIFEST_BASE != ''
        run: |
          if ! ls assets/*.sig >/dev/null 2>&1; then
            echo "::warning::No updater signatures in this build (TAURI_SIGNING_PRIVATE_KEY unset?): no latest.json"
            exit 0
          fi
          node tools/updater-manifest.mjs --dir assets --version "$VERSION" \
            --base-url "$MANIFEST_BASE" --platforms "$PLATFORMS" \
            --notes "Build ${GITHUB_SHA::12} of $GITHUB_REF_NAME"
          cat assets/latest.json

      # What Settings › About's "Get the desktop app" reads: the installers,
      # at the same base as the updater's bundles (the team host serves it as
      # /updates/downloads.json, the dist job as stable/downloads.json).
      - name: Downloads manifest
        if: env.MANIFEST_BASE != ''
        run: |
          node tools/downloads-manifest.mjs --dir assets --version "$VERSION" --base-url "$MANIFEST_BASE"
          cat assets/downloads.json

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Created as a draft and published only once every asset is attached, so
      # nothing (the team host's pull, a teammate) ever sees a half-uploaded release.
      # A run cancelled in between leaves an orphan draft: delete it by hand.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$CHANNEL" in
            continuous) pre=(--prerelease --latest=false); publish=true ;;
            nightly)    pre=(--prerelease --latest=false); publish=true ;;
            draft)      pre=(--prerelease --latest=false); publish=false ;;
            tagged)     pre=();                            publish=false ;;
          esac
          docs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/desktop-builds.md"
          notes="Build of ${GITHUB_SHA::12} from $GITHUB_REF_NAME ($CHANNEL; relay: ${RELAY:-none}; update feed: $UPDATER_ENDPOINT).

          Unsigned builds: macOS is ad-hoc signed and not notarized. Install notes: $docs
          Verify downloads against SHA256SUMS.txt (\`sha256sum -c SHA256SUMS.txt --ignore-missing\`)."
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft "${pre[@]}" \
            --target "$GITHUB_SHA" \
            --title "Oh Hi markdown $TAG" \
            --notes "$notes"
          if [ "$publish" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            echo "::notice::Published $TAG"
          else
            echo "::notice::Draft $TAG created: check the assets and publish it by hand"
          fi

  # The public channel's download host: the R2 bucket `ohhi-dist` behind
  # https://dist.ohhi.md (docs/public-deploy.md). Runs only for a PUBLISHED
  # public build: a push to `release` (or Run workflow on it with channel
  # public, the default), and every nightly. It uploads
  # what the release job published — read back from the release, checked
  # against its SHA256SUMS.txt — so the bucket never holds a file GitHub
  # doesn't:
  #   <version>/<file>        every asset but web.tar.gz (the public web app
  #                           is on Pages): cached forever, never rewritten
  #   stable/latest/<name>    the newest installers under version-less names
  #                           (ohhi_universal.dmg, ohhi_amd64.AppImage,
  #                           ohhi_amd64.deb) plus a SHA256SUMS.txt of those
  #                           names: what ohhi.md/download links to
  #   stable/downloads.json   Settings › About's "Get the desktop app"
  #   stable/latest.json      the updater feed, LAST, so no installed app is
  #                           offered a bundle that isn't there yet
  # A nightly uses the same layout one level down: nightly/<version>/<file>,
  # nightly/latest/ohhi-nightly_amd64.AppImage, nightly/downloads.json and
  # nightly/latest.json (KEY_PREFIX and DIST_DIR from `meta`).
  # Everything under stable/ and nightly/ but the versioned files is
  # `no-store`: a cached manifest would hold every app back, and a cached
  # installer could be a different release from the checksum file beside it.
  # Checks nothing out; its only third-party code is the pinned wrangler.
  dist:
    name: upload to dist.ohhi.md (R2)
    needs: [meta, release]
    if: needs.meta.outputs.flavour == 'public' && (needs.meta.outputs.channel == 'continuous' || needs.meta.outputs.channel == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      DIST_DIR: ${{ needs.meta.outputs.dist_dir }}
      KEY_PREFIX: ${{ needs.meta.outputs.key_prefix }}
      BUCKET: ohhi-dist
      WRANGLER: wrangler@4.145.0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets present?
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set: $TAG is on GitHub only, not on dist.ohhi.md (docs/public-deploy.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Fetch the published release
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          (cd assets && sha256sum --quiet -c SHA256SUMS.txt)
          ls -l assets

      - name: Upload to R2
        if: steps.secrets.outputs.ok == 'true'
        working-directory: assets
        run: |
          put() { # <key> <file> <content-type> <cache-control>
            echo "→ $BUCKET/$1 ($3; $4)"
            npx --yes "$WRANGLER" r2 object put "$BUCKET/$1" --file "$2" \
              --content-type "$3" --cache-control "$4" --remote
          }
          type_of() {
            case $1 in
              *.dmg) echo application/x-apple-diskimage ;;
              *.deb) echo application/vnd.debian.binary-package ;;
              *.AppImage) echo application/vnd.appimage ;;
              *.apk) echo application/vnd.android.package-archive ;;
              *.tar.gz) echo application/gzip ;;
              *.json) echo application/json ;;
              *.sig | *.txt) echo 'text/plain; charset=utf-8' ;;
              *) echo application/octet-stream ;;
            esac
          }
          forever='public, max-age=31536000, immutable'
          for f in *; do
            [ "$f" = web.tar.gz ] && continue
            put "$KEY_PREFIX$VERSION/$f" "$f" "$(type_of "$f")" "$forever"
          done
          # The landing page (apps/site/src/links.ts) links the newest
          # installer by a name without the version; its SHA256SUMS.txt lists
          # those names, so `sha256sum -c` works on what was downloaded there.
          : > latest-sums.txt
          for f in *.dmg *.AppImage *.deb; do
            [ -f "$f" ] || continue
            alias="${f/_${VERSION}_/_}"
            put "$DIST_DIR/latest/$alias" "$f" "$(type_of "$f")" no-store
            awk -v f="$f" -v a="$alias" '$2 == f { print $1 "  " a }' SHA256SUMS.txt >> latest-sums.txt
          done
          [ -s latest-sums.txt ] || { echo "::error::no installer to alias under $DIST_DIR/latest/"; exit 1; }
          put "$DIST_DIR/latest/SHA256SUMS.txt" latest-sums.txt 'text/plain; charset=utf-8' no-store
          if [ -f downloads.json ]; then
            put "$DIST_DIR/downloads.json" downloads.json application/json no-store
          fi
          if [ -f latest.json ]; then
            put "$DIST_DIR/latest.json" latest.json application/json no-store
          else
            echo "::warning::$TAG has no latest.json (unsigned build): $DIST_DIR/latest.json left as it was"
          fi
          echo "::notice::$TAG is on https://dist.ohhi.md/$KEY_PREFIX$VERSION/, $DIST_DIR/latest/ and $DIST_DIR/"

  # One prerelease a night would bury the real releases: once a nightly is on
  # dist.ohhi.md, the newest seven nightly releases stay and older ones go
  # with their tags, never the one just published. Their files stay in the
  # bucket (immutable keys), pruned by hand if it ever needs it. Its own job,
  # after the upload: a refused delete must not stop the upload, and nothing
  # is pruned for a nightly that never reached the feed.
  prune:
    name: prune old nightlies
    needs: [meta, dist]
    if: needs.meta.outputs.channel == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete nightly releases beyond the newest seven
        run: |
          # Release ids only go up as releases are created; created_at is the
          # commit's date, so a nightly of an old branch would sort as old.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft | not) | select(.tag_name | startswith(\"nightly-v\")) | select(.tag_name != \"$TAG\")] | sort_by(.id) | reverse | .[6:] | .[].tag_name" |
          while read -r old; do
            [ -n "$old" ] || continue
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "pruned $old"
          done
