# Desktop release: builds the Tauri 2 app for Linux (AppImage + .deb) and macOS
# (one universal .dmg), then publishes them as a DRAFT GitHub Release.
# How to cut one, where artifacts land, install notes: docs/desktop-builds.md.
#
# Security shape:
# - Build jobs run third-party code (npm deps, cargo build scripts, the Tauri
#   bundler) with a READ-ONLY token and no persisted git credentials. Only the
#   small `release` job, which checks nothing out and builds nothing, can write.
# - Every third-party action is pinned to a full commit SHA (tag in the comment).
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 = glibc 2.35 baseline: the AppImage/.deb run on 22.04 and newer.
          - name: linux-x86_64
            runner: ubuntu-22.04
            rust-targets: ''
            args: --bundles appimage,deb
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          # One universal .dmg (arm64 + x86_64 lipo'd) instead of two per-arch
          # jobs: teammates cannot download the wrong one, and total macOS
          # minutes are about the same (each arch compiles once either way).
          - name: macos-universal
            runner: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read app version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/src-tauri/tauri.conf.json version $version"
            exit 1
          fi

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            libdbus-1-dev patchelf file xdg-utils

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      # tauri.conf.json's beforeBuildCommand is intentionally empty (Rush drives
      # the web app; see apps/desktop/README.md), so the frontend is built here,
      # where the release-time env is visible in the workflow, before Tauri
      # embeds apps/web/dist.
      - name: Build web app
        working-directory: apps/web
        env:
          VITE_DEFAULT_RELAY: ${{ vars.DEFAULT_RELAY }}
        run: node ../../common/scripts/install-run-rushx.js build

      - name: CSP guard
        run: node apps/desktop/scripts/check-csp.mjs

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}

      # Build only: no tagName/releaseId, so tauri-action creates no release and
      # needs no token. tauriScript is the repo's pinned @tauri-apps/cli; without
      # it the action cannot see Rush's lockfile and installs an unpinned CLI.
      #
      # macOS is ad-hoc signed (bundle.macOS.signingIdentity "-"). To sign and
      # notarize, add these secrets (APPLE_CERTIFICATE = base64 Developer ID
      # Application .p12; APPLE_PASSWORD = app-specific password), uncomment,
      # and drop signingIdentity "-" from tauri.conf.json.
      - name: Build desktop app
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        # env:
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: ${{ github.workspace }}/apps/desktop/node_modules/.bin/tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ohhi-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      # A multi-path upload is rooted at the paths' common ancestor, so the Linux
      # artifact arrives as appimage/ and deb/ subfolders: flatten first.
      - name: Checksums
        working-directory: assets
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DEFAULT_RELAY: ${{ vars.DEFAULT_RELAY }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"; pre=()
          else
            tag="v${VERSION}-dogfood.${GITHUB_RUN_NUMBER}"; pre=(--prerelease)
          fi
          docs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/desktop-builds.md"
          notes="Dogfood build of ${GITHUB_SHA::12} (default relay: ${DEFAULT_RELAY:-none}).

          Unsigned builds: macOS is ad-hoc signed and not notarized. Install notes: $docs
          Verify downloads against SHA256SUMS.txt (\`sha256sum -c SHA256SUMS.txt --ignore-missing\`)."
          gh release create "$tag" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft "${pre[@]}" \
            --target "$GITHUB_SHA" \
            --title "Oh hi markdown $tag" \
            --notes "$notes"
