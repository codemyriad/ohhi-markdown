# Dev front proxy for the local Nextcloud stack (compose project `spreedtest`):
# the sidecar `ohhi-rp-port` (nginx:alpine on network spreedtest_default,
# host port 28090) that scripts/nc-dev-install.sh starts.
#
# Why it exists: the stack's own reverse proxy does not forward
# `Upgrade`/`Connection` on /exapps/, so a WebSocket to /exapps/ohhi/ws never
# reaches HaRP (spike S16-Q1 trap b). Any production front proxy needs the
# same two headers on /exapps/ — see docs/nextcloud.md.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1024M;
    proxy_buffering off;
    proxy_request_buffering off;
    # HAProxy's tunnel timeout is 1800 s; keep idle sockets open at least as long.
    proxy_read_timeout 3600s;

    # ExApps: straight to HaRP, WebSocket upgrades included.
    location /exapps/ {
        proxy_pass http://appapi-harp:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_pass_request_headers on;
    }

    # Everything else: Nextcloud.
    location / {
        proxy_pass http://nextcloud:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
