# Untested template — review before the first `fly deploy`.
# Single region, single instance, volume-pinned (docs/architecture/relay.md):
# the relay is never the sole copy of anything, so one machine is the design.
app = "editor-relay" # placeholder — rename per environment
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[mounts]
  source = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep the machine up: it holds live websockets and the debounced doc store.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
