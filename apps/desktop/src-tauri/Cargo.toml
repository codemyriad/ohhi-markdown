[package]
name = "ohhi-desktop"
version = "0.2.0"
description = "Oh hi markdown desktop shell (Tauri 2)"
license = "AGPL-3.0-only"
edition = "2021"
# Tauri 2.12 (the iOS 27 SDK's UIScene life cycle, docs/mobile-builds.md) and
# every current 2.x crate declare 1.90; cargo refuses an older toolchain here
# with a clear message instead of a page of errors.
rust-version = "1.90"
publish = false

# The `_lib` suffix avoids the lib/bin artifact name clash on Windows;
# staticlib/cdylib are required for the (future) mobile targets.
[lib]
name = "ohhi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# generate_context! emits serde_json for the `plugins` block of tauri.conf.json.
serde_json = "1"
tauri-plugin-persisted-scope = "2"

# Self-update (docs/desktop-builds.md): the feed check and the relaunch into
# an installed update. Desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
