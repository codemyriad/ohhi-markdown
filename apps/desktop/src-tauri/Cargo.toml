[package]
name = "ohhi-desktop"
version = "0.1.0"
description = "Editor desktop shell (Tauri 2)"
edition = "2021"
publish = false

# The `_lib` suffix avoids the lib/bin artifact name clash on Windows;
# staticlib/cdylib are required for the (future) mobile targets.
[lib]
name = "ohhi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# generate_context! emits serde_json for the `plugins` block of tauri.conf.json.
serde_json = "1"

# Self-update (docs/desktop-builds.md): the feed check and the relaunch into
# an installed update. Desktop only; locked to versions rustc 1.88 builds.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
