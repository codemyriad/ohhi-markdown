[package]
name = "editor-desktop"
version = "0.1.0"
description = "Editor desktop shell (Tauri 2)"
edition = "2021"
publish = false

# The `_lib` suffix avoids the lib/bin artifact name clash on Windows;
# staticlib/cdylib are required for the (future) mobile targets.
[lib]
name = "editor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
